<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="brand">
      <img src="assets/logo.png" alt="" (error)="$any($event.target).style.display='none'" />
      <div class="brand-text">
        <strong>Upplands El</strong>
        <span>&amp; Bemanning</span>
      </div>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>{{ i18n.t('nav.dashboard') }}</span>
      </a>
      <a mat-list-item routerLink="/leads" routerLinkActive="active">
        <mat-icon matListItemIcon>groups</mat-icon>
        <span matListItemTitle>{{ i18n.t('nav.leads') }}</span>
      </a>
      <a mat-list-item routerLink="/campaigns" routerLinkActive="active">
        <mat-icon matListItemIcon>mail</mat-icon>
        <span matListItemTitle>{{ i18n.t('nav.campaigns') }}</span>
      </a>
      <a mat-list-item routerLink="/users" routerLinkActive="active">
        <mat-icon matListItemIcon>manage_accounts</mat-icon>
        <span matListItemTitle>{{ i18n.t('nav.users') }}</span>
      </a>
      <a mat-list-item routerLink="/settings" routerLinkActive="active">
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>{{ i18n.t('nav.settings') }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      <span class="spacer"></span>
      <button
        mat-icon-button
        (click)="theme.toggle()"
        [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="theme.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <mat-icon>{{ theme.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <span class="user">{{ username() }}</span>
      <button mat-icon-button (click)="logout()" [attr.aria-label]="i18n.t('nav.logout')" [title]="i18n.t('nav.logout')">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
