<div class="login-page">
  <mat-card class="login-card">
    <div class="login-logo">
      <img src="assets/logo.png" alt="Upplands El & Bemanning" (error)="$any($event.target).style.display='none'" />
      <h1>Upplands El &amp; Bemanning</h1>
      <p class="subtitle">{{ i18n.t('login.subtitle') }}</p>
    </div>

    <form (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ i18n.t('login.username') }}</mat-label>
        <input matInput name="username" [(ngModel)]="username" autocomplete="username" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ i18n.t('login.password') }}</mat-label>
        <input matInput type="password" name="password" [(ngModel)]="password" autocomplete="current-password" required />
      </mat-form-field>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="loading()">
        @if (loading()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          {{ i18n.t('login.signIn') }}
        }
      </button>
    </form>

    <div class="lang-switch">
      <button type="button" [class.active]="i18n.lang() === 'en'" (click)="i18n.setLang('en')">EN</button>
      <span>/</span>
      <button type="button" [class.active]="i18n.lang() === 'sv'" (click)="i18n.setLang('sv')">SV</button>
    </div>
  </mat-card>
</div>
